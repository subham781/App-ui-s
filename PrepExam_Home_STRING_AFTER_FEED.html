<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PrepExam Home</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#eef2f7;color:#0f172a;min-height:100vh}
.page{max-width:640px;margin:0 auto;padding:12px 12px 90px;position:relative}

/* compact top */
.top-strip{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.brand{font-size:.95rem;font-weight:800;letter-spacing:-.2px}
.brand span{color:#2563eb}
.lang-switch{display:flex;background:#e2e8f0;border-radius:10px;padding:3px}
.lang-btn{border:0;background:transparent;padding:5px 10px;border-radius:8px;font-size:.72rem;font-weight:700;color:#64748b}
.lang-btn.active{background:#2563eb;color:#fff}

.section-label{font-size:.68rem;font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:.45px;margin:0 0 8px 2px}

/* ads compact */
.adds-wrapper{overflow-x:auto;padding-bottom:4px;margin-bottom:12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.adds-wrapper::-webkit-scrollbar{display:none}
.adds-track{display:flex;gap:10px;width:max-content}
.ad-card{width:200px;height:100px;border-radius:14px;overflow:hidden;flex-shrink:0;cursor:pointer;border:1px solid #e2e8f0;position:relative;background:linear-gradient(135deg,#dbeafe,#e0e7ff)}
.ad-card img{width:100%;height:100%;object-fit:cover;display:block}
.ad-card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(15,23,42,.8) 100%)}
.ad-card:active{transform:scale(.97)}
.ad-label{position:absolute;left:10px;right:10px;bottom:8px;z-index:1;color:#fff;font-size:.75rem;font-weight:700}
.ad-pill{position:absolute;top:8px;left:8px;z-index:1;background:rgba(255,255,255,.95);color:#0f172a;font-size:.6rem;font-weight:800;padding:3px 7px;border-radius:999px}

/* features dropdown */
.feat-drop{background:#fff;border:1px solid #e8ecf4;border-radius:16px;margin-bottom:14px;box-shadow:0 2px 12px rgba(15,23,42,.04);overflow:hidden}
.feat-toggle{width:100%;border:0;background:#fff;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-weight:700;font-size:.88rem;color:#0f172a}
.feat-toggle span.hint{font-size:.72rem;font-weight:600;color:#64748b}
.feat-toggle .chev{transition:transform .2s;color:#64748b;font-size:12px}
.feat-drop.open .chev{transform:rotate(180deg)}
.feat-body{display:none;padding:0 10px 12px;border-top:1px solid #f1f5f9}
.feat-drop.open .feat-body{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-top:10px}
.feature-card{background:#f8fafc;border-radius:14px;padding:12px;border:1px solid #eef2f7;cursor:pointer;text-align:left}
.feature-card:active{transform:scale(.97)}
.icon-box{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:8px}
.feature-card h3{font-size:.82rem;font-weight:700;margin-bottom:2px}
.feature-card p{font-size:.68rem;color:#64748b;line-height:1.3}
.color-1{background:linear-gradient(135deg,#dbeafe,#bfdbfe)}
.color-2{background:linear-gradient(135deg,#fce7f3,#fbcfe8)}
.color-3{background:linear-gradient(135deg,#d1fae5,#a7f3d0)}
.color-4{background:linear-gradient(135deg,#fef3c7,#fde68a)}
.color-5{background:linear-gradient(135deg,#e0e7ff,#c7d2fe)}

/* feed first - big */
.feed-head{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
.feed-head h2{font-size:1.05rem;font-weight:800}
.feed-head .live{font-size:.68rem;font-weight:700;color:#059669;background:#ecfdf5;border:1px solid #a7f3d0;padding:4px 8px;border-radius:999px}

.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;border:1px solid #e8ecf4;box-shadow:0 2px 12px rgba(15,23,42,.04)}
.tag{display:inline-block;font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.3px;padding:3px 8px;border-radius:999px;margin-bottom:8px}
.tag-mcq{background:#eff6ff;color:#1d4ed8}
.tag-post{background:#fdf2f8;color:#be185d}

.post-header{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.9rem;flex-shrink:0}
.uname{font-size:.9rem;font-weight:700}
.exam-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.exam-chip{font-size:.62rem;font-weight:700;background:#f1f5f9;color:#334155;padding:2px 7px;border-radius:6px}
.exam-chip.py{background:#fff7ed;color:#c2410c}
.meta{font-size:.7rem;color:#94a3b8;margin-top:3px}

.q{font-size:1rem;font-weight:600;line-height:1.45;margin-bottom:12px}
.options{display:flex;flex-direction:column;gap:8px}
.option{border:1.5px solid #e2e8f0;border-radius:10px;padding:11px 12px;font-size:.9rem;cursor:pointer;background:#fff}
.option:active{background:#f8fafc}
.option.correct{background:#ecfdf5;border-color:#22c55e;color:#15803d;font-weight:600}
.option.wrong{background:#fef2f2;border-color:#ef4444;color:#b91c1c}
.option.disabled{pointer-events:none}
.footer-line{margin-top:12px;padding-top:10px;border-top:1px solid #f1f5f9;font-size:.78rem;color:#64748b}

.post-img-wrap{width:100%;border-radius:12px;overflow:hidden;background:#e2e8f0;margin:6px 0 10px;min-height:160px;max-height:300px}
.post-img-wrap img{width:100%;height:100%;max-height:300px;object-fit:cover;display:block}
.actions{display:flex;gap:14px;align-items:center;margin-bottom:8px}
.action{border:0;background:none;padding:0;cursor:pointer}
.action svg{width:24px;height:24px;stroke:#262626;fill:none;stroke-width:2}
.action.like.active svg{fill:#ed4956;stroke:#ed4956}
.action.save{margin-left:auto}
.action.save.active svg{fill:#262626}
.likes{font-size:.84rem;font-weight:700;margin-bottom:4px}
.ptitle{font-size:.9rem;font-weight:700;margin-bottom:4px}
.pdesc{font-size:.84rem;color:#334155;line-height:1.45}

.loading,.error{text-align:center;padding:32px 16px;color:#64748b;font-size:.9rem}
.retry{margin-top:10px;border:0;background:#2563eb;color:#fff;padding:10px 14px;border-radius:10px;font-weight:700}

.insight-wrap{display:none;margin-top:12px}
.insight-wrap.show{display:block}
.insight-title{font-size:.78rem;font-weight:700;color:#2563eb;margin-bottom:8px}
.insight-scroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.insight-scroll::-webkit-scrollbar{display:none}
.insight-card{min-width:200px;background:#f0f7ff;border:1px solid #dbeafe;border-radius:12px;padding:11px;flex-shrink:0;cursor:pointer}
.insight-card h4{font-size:.82rem;font-weight:700;margin-bottom:5px}
.insight-card p{font-size:.72rem;color:#4b5563;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* scroll hint */
.scroll-hint{
  position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
  z-index:50;display:flex;flex-direction:column;align-items:center;gap:4px;
  background:rgba(15,23,42,.88);color:#fff;padding:10px 16px;border-radius:999px;
  box-shadow:0 8px 28px rgba(15,23,42,.25);font-size:.72rem;font-weight:700;
  animation:bob 1.4s ease-in-out infinite;pointer-events:none;opacity:1;transition:opacity .4s
}
.scroll-hint.hide{opacity:0}
.scroll-hint .arrow{font-size:14px;line-height:1}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(5px)}}


/* pull to refresh */
.pull-refresh{
  position:fixed;left:50%;top:8px;transform:translate(-50%,-70px);
  z-index:10001;background:rgba(15,23,42,.92);color:#fff;
  padding:8px 14px;border-radius:999px;font-size:.72rem;font-weight:700;
  opacity:0;transition:transform .2s,opacity .2s;pointer-events:none;
}
.pull-refresh.show{transform:translate(-50%,0);opacity:1}

#viewer{display:none;position:fixed;inset:0;background:#fff;z-index:9999;flex-direction:column}
.viewer-header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#f8fafc;border-bottom:1px solid #e2e8f0}
.back-btn{width:40px;height:40px;border-radius:12px;border:0;background:#e2e8f0;font-size:18px}
.viewer-title{font-size:1rem;font-weight:700}
#viewer-frame{flex:1;width:100%;border:0}
.v-loading{flex:1;display:flex;align-items:center;justify-content:center;color:#64748b}

.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10000;display:none;align-items:flex-end;justify-content:center}
.sheet-overlay.show{display:flex}
.sheet{width:100%;max-width:700px;height:85vh;background:#fff;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sheet-header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid #e4e6eb}
.sheet-header h3{flex:1;font-size:.95rem;font-weight:700}
.sheet-close{border:0;background:#e4e6eb;width:34px;height:34px;border-radius:10px}
.sheet-frame{flex:1;width:100%;border:0;display:none}
.sheet-loading{padding:20px;text-align:center;color:#65676b}

.interact-bar{display:flex;gap:8px;margin-top:10px}
.interact-btn{flex:1;border:1px solid #e2e8f0;background:#f8fafc;border-radius:10px;padding:8px;font-size:.72rem;font-weight:700;color:#475569;cursor:pointer}
.interact-btn:active{background:#eef2ff;color:#3730a3}
.q-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.q-action{flex:1;min-width:92px;border:1px solid #e2e8f0;background:#f8fafc;border-radius:10px;padding:9px 8px;font-size:.72rem;font-weight:800;color:#475569;cursor:pointer}
.q-action.active{background:#eff6ff;border-color:#93c5fd;color:#1d4ed8}
.q-action.revision.active{background:#ecfdf5;border-color:#86efac;color:#15803d}
.follow-btn{margin-left:auto;border:1px solid #bfdbfe;background:#eff6ff;color:#2563eb;border-radius:999px;padding:6px 10px;font-size:.68rem;font-weight:800;cursor:pointer;white-space:nowrap}
.follow-btn.following{background:#f1f5f9;color:#475569;border-color:#e2e8f0}
</style>
</head>
<body>
<div class="pull-refresh" id="pullRefresh">↓ Pull to refresh</div>
<div class="page" id="main-page">
<div class="section-label">Sponsored</div>
  <div class="adds-wrapper"><div class="adds-track" id="addsTrack"></div></div>

  <div class="feat-drop" id="featDrop">
    <button class="feat-toggle" type="button" id="featToggle">
      <span>⚡ Tools & Features</span>
      <span><span class="hint">tap to open</span> <span class="chev">▼</span></span>
    </button>
    <div class="feat-body" id="featuresContainer"></div>
  </div>

  <div class="feed-head">
    <h2>Practice feed</h2>
    <span class="live">● Live mix</span>
  </div>
  <div id="mixedFeed"><div class="loading">Loading practice...</div></div>
</div>

<div class="scroll-hint" id="scrollHint">
  <span class="arrow">↓</span>
  <span>Scroll &amp; practice</span>
</div>

<div id="viewer">
  <div class="viewer-header">
    <button class="back-btn" type="button" id="btnViewerBack">←</button>
    <div class="viewer-title" id="viewer-title">Loading...</div>
  </div>
  <div class="v-loading" id="loading">Loading...</div>
  <iframe id="viewer-frame" style="display:none"></iframe>
</div>

<div class="sheet-overlay" id="sheetOverlay">
  <div class="sheet">
    <div class="sheet-header">
      <h3 id="sheetTitle">Topic</h3>
      <button class="sheet-close" type="button" id="btnSheetClose">✕</button>
    </div>
    <div class="sheet-loading" id="sheetLoading">Opening...</div>
    <iframe class="sheet-frame" id="sheetFrame"></iframe>
  </div>
</div>

<script>
(function () {
  var MSG_OPEN = "OPEN";
  var MSG_BACK = "BACK";

  var MCQ_API = "https://script.google.com/macros/s/AKfycbyICNHxGGgvd7TBcgSxjQm3obJqDOGtHHiwiwUoXnxiNurmqmWDfwOXo5x9rfQqnXs/exec";
  var POSTS_API = "https://script.google.com/macros/s/AKfycbzVYw5uC-1sASG-6BAMChC3JhCqKK-0LHMgmkQjEmAolRF8_3ozyETPH6cEWBVqDil3/exec";

  var userId = "";
  var userProfile = {};
  var likedQuestions = {};
  var revisionQuestions = {};
  var followedUsers = {};

  function getWebViewString() {
    try {
      if (window.AppInventor && typeof window.AppInventor.getWebViewString === "function")
        return String(window.AppInventor.getWebViewString() || "").trim();
      if (window.Kodular && typeof window.Kodular.getWebViewString === "function")
        return String(window.Kodular.getWebViewString() || "").trim();
    } catch (e) {}
    return "";
  }

  var FIREBASE_DB = "https://prepexam-f98bf-default-rtdb.firebaseio.com";

  function safeKey(v) {
    return String(v || "").replace(/[.#$\[\]\/]/g, "_");
  }

  async function firebaseGet(path) {
    var r = await fetch(FIREBASE_DB + "/" + path + ".json?t=" + Date.now());
    if (!r.ok) throw new Error("Firebase GET " + r.status);
    return await r.json();
  }

  async function firebasePatch(values) {
    var r = await fetch(FIREBASE_DB + "/.json", {
      method: "PATCH",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(values)
    });
    if (!r.ok) throw new Error("Firebase PATCH " + r.status);
    return true;
  }

  async function loadCurrentUser() {
    /* User string is read ONLY after the feed has already been loaded.
       This function must never be required for MCQs to appear. */
    userId = getWebViewString();
    if (!userId) {
      await new Promise(function (r) { setTimeout(r, 350); });
      userId = getWebViewString();
    }
    if (!userId) return;
    try {
      var data = await firebaseGet("Users/" + safeKey(userId));
      if (data) {
        userProfile = data || {};
        likedQuestions = userProfile.likedQuestions || {};
        revisionQuestions = userProfile.revisionQuestions || {};
        followedUsers = userProfile.following || {};
      }
      refreshActionStates();
    } catch (e) {
      console.warn("User profile load failed:", e);
      /* Feed is already visible; Firebase failure must not affect it. */
    }
  }

  function refreshActionStates() {
    document.querySelectorAll('.card[data-qid]').forEach(function(card) {
      var qid = card.getAttribute('data-qid') || '';
      var likeBtn = card.querySelector('[data-qact="like"]');
      var revBtn = card.querySelector('[data-qact="revision"]');
      if (likeBtn) {
        var liked = Boolean(likedQuestions[qid]);
        likeBtn.classList.toggle('active', liked);
        likeBtn.textContent = liked ? '♥ Liked' : '♡ Like';
      }
      if (revBtn) {
        var revised = Boolean(revisionQuestions[qid]);
        revBtn.classList.toggle('active', revised);
        revBtn.textContent = revised ? '✓ In Revision' : '+ Add to Revision';
      }
    });

    document.querySelectorAll('.card[data-target-user]').forEach(function(card) {
      var targetId = card.getAttribute('data-target-user') || '';
      var btn = card.querySelector('.follow-btn');
      if (btn && targetId) {
        var following = Boolean(followedUsers[targetId]);
        btn.classList.toggle('following', following);
        btn.textContent = following ? 'Following' : 'Follow';
      }
    });
  }

  async function setUserMapValue(mapName, key, enabled) {
    if (!userId || !key) {
      alert("User ID not found. Please reopen the app.");
      return false;
    }
    try {
      var values = {};
      values["Users/" + safeKey(userId) + "/" + mapName + "/" + safeKey(key)] = enabled ? true : null;
      await firebasePatch(values);
      return true;
    } catch (e) {
      console.warn(mapName + " update failed:", e);
      return false;
    }
  }

  function getQid(item) {
    return String(item && (item.qid || item.id || item.questionId) || "").trim();
  }

  function getTargetUserId(item) {
    return String(item && (item.channelId || item.creatorId || item.userId || item.ownerId) || "").trim();
  }

  async function toggleQuestionLike(qid, btn) {
    if (!qid) return;
    var next = !Boolean(likedQuestions[qid]);
    var ok = await setUserMapValue("likedQuestions", qid, next);
    if (!ok) return;
    if (next) likedQuestions[qid] = true; else delete likedQuestions[qid];
    btn.classList.toggle("active", next);
    btn.textContent = next ? "♥ Liked" : "♡ Like";
  }

  async function toggleRevision(qid, btn) {
    if (!qid) return;
    var next = !Boolean(revisionQuestions[qid]);
    var ok = await setUserMapValue("revisionQuestions", qid, next);
    if (!ok) return;
    if (next) revisionQuestions[qid] = true; else delete revisionQuestions[qid];
    btn.classList.toggle("active", next);
    btn.textContent = next ? "✓ In Revision" : "+ Add to Revision";
  }

  async function toggleFollow(targetId, btn) {
    if (!targetId || !userId) {
      if (!userId) alert("User ID not found. Please reopen the app.");
      return;
    }
    if (targetId === userId) return;
    var next = !Boolean(followedUsers[targetId]);
    try {
      var updates = {};
      updates["Users/" + safeKey(userId) + "/following/" + safeKey(targetId)] = next ? true : null;
      await firebasePatch(updates);
      if (next) followedUsers[targetId] = true; else delete followedUsers[targetId];
      btn.classList.toggle("following", next);
      btn.textContent = next ? "Following" : "Follow";
    } catch (e) {
      console.warn("Follow update failed:", e);
    }
  }

  var EXAM_POOL = ["CGL", "CHSL", "MTS", "GD", "CPO", "NDA", "CDS", "Navy", "Army", "Air Force"];
  var YEAR_POOL = ["2019", "2020", "2021", "2022", "2023", "2024", "2025"];

  var ads = [
    {
      id: "ad_1",
      title: "SSC Foundation Course",
      image: "https://picsum.photos/seed/ssc1/480/260",
      link: "https://raw.githubusercontent.com/subham781/App-ui-s/refs/heads/main/Recents"
    },
    {
      id: "ad_2",
      title: "Defence Batch",
      image: "https://picsum.photos/seed/def2/480/260",
      link: "https://raw.githubusercontent.com/subham781/App-ui-s/refs/heads/main/Recents"
    },
    {
      id: "ad_3",
      title: "Mock Test Series",
      image: "https://picsum.photos/seed/mock3/480/260",
      link: "https://raw.githubusercontent.com/subham781/App-ui-s/refs/heads/main/Recents"
    },
    {
      id: "ad_4",
      title: "Study Material Pack",
      image: "https://picsum.photos/seed/study4/480/260",
      link: "https://raw.githubusercontent.com/subham781/App-ui-s/refs/heads/main/Recents"
    }
  ];

  var features = [
    { id: "graph_plotter", title: "Graph Plotter", description: "Plot math graphs", icon: "📈", color: "color-1",
      link: "https://raw.githubusercontent.com/subham781/App-ui-s/refs/heads/main/GRAPH%20PLOTER" },
    { id: "synonyms_finder", title: "Synonyms Finder", description: "Better words fast", icon: "📚", color: "color-2",
      link: "https://raw.githubusercontent.com/subham781/App-ui-s/refs/heads/main/Ant%20and%20syn%20finder" },
    { id: "calculator", title: "Smart Calculator", description: "Scientific calc", icon: "🧮", color: "color-3",
      link: "https://raw.githubusercontent.com/subham781/App-ui-s/refs/heads/main/Smart%20calculator" },
    { id: "unit_converter", title: "Unit Convertor", description: "Length, weight", icon: "🔄", color: "color-4",
      link: "https://raw.githubusercontent.com/subham781/App-ui-s/refs/heads/main/Unit%20converter" },
    { id: "formula_sheet", title: "Flash Card", description: "Key formulas", icon: "📝", color: "color-5",
      link: "https://raw.githubusercontent.com/subham781/App-ui-s/refs/heads/main/FLASH%20CARD" }
  ];

  var wikiLang = "en";

  function $(id) { return document.getElementById(id); }
  function escapeHTML(v) {
    return String(v || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  function sendWebViewString(value) {
    try {
      if (window.Kodular && window.Kodular.setWebViewString) window.Kodular.setWebViewString(value);
      if (window.AppInventor && window.AppInventor.setWebViewString) window.AppInventor.setWebViewString(value);
    } catch (e) {}
  }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function examTagsHtml(item) {
    var exam = (item.exam || item.subject || "").toString().trim();
    var chips = [];
    if (exam) {
      var up = exam.toUpperCase();
      EXAM_POOL.forEach(function (e) {
        if (up.indexOf(e.toUpperCase()) !== -1) chips.push(e);
      });
    }
    if (!chips.length) {
      chips.push(pick(EXAM_POOL));
      if (Math.random() > 0.5) chips.push(pick(EXAM_POOL));
    }
    chips = chips.filter(function (v, i, a) { return a.indexOf(v) === i; }).slice(0, 3);
    var year = item.year || pick(YEAR_POOL);
    var html = chips.map(function (c) {
      return '<span class="exam-chip">' + escapeHTML(c) + "</span>";
    }).join("");
    html += '<span class="exam-chip py">PYQ ' + escapeHTML(year) + "</span>";
    return html;
  }

  // Features dropdown
  $("featToggle").onclick = function () {
    $("featDrop").classList.toggle("open");
  };

  // Ads
  var track = $("addsTrack");
  ads.forEach(function (item) {
    var card = document.createElement("div");
    card.className = "ad-card";
    card.innerHTML =
      '<img src="' + item.image + '" alt="" loading="lazy" referrerpolicy="no-referrer">' +
      '<div class="ad-pill">Ad</div>' +
      '<div class="ad-label">' + escapeHTML(item.title) + "</div>";
    card.onclick = function () {
      sendWebViewString(MSG_OPEN);
      if (item.link && String(item.link).trim()) openViewer(item.title, item.link);
    };
    track.appendChild(card);
  });

  // Features inside dropdown
  var fc = $("featuresContainer");
  features.forEach(function (f) {
    var card = document.createElement("div");
    card.className = "feature-card";
    card.innerHTML =
      '<div class="icon-box ' + f.color + '">' + f.icon + "</div>" +
      "<h3>" + escapeHTML(f.title) + "</h3><p>" + escapeHTML(f.description) + "</p>";
    card.onclick = function () {
      sendWebViewString(MSG_OPEN);
      if (f.link) openViewer(f.title, f.link);
    };
    fc.appendChild(card);
  });

  function isProbablyHtmlUrl(url) {
    var u = String(url || "").toLowerCase().split("?")[0].split("#")[0];
    return /\\.(html?|xhtml)$/.test(u) ||
           u.indexOf("raw.githubusercontent.com") !== -1 ||
           u.indexOf("/refs/heads/") !== -1;
  }

  function openViewer(title, url) {
    url = String(url || "").trim();
    if (!url) return;

    /* Normal websites such as Instagram/YouTube should be opened normally.
       HTML/raw links continue to use the existing in-app viewer. */
    if (!isProbablyHtmlUrl(url)) {
      sendWebViewString("OPEN_URL|" + url);
      try {
        window.open(url, "_blank");
      } catch (e) {
        location.href = url;
      }
      return;
    }

    $("main-page").style.display = "none";
    $("scrollHint").classList.add("hide");
    $("viewer").style.display = "flex";
    $("viewer-title").textContent = title || "Open";
    $("loading").style.display = "flex";
    $("loading").textContent = "Loading...";
    $("viewer-frame").style.display = "none";

    /* Keep HTML/raw GitHub behavior exactly as before. */
    fetch(url)
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.text();
      })
      .then(function (pageHtml) {
        var frame = $("viewer-frame");
        var doc = frame.contentDocument || frame.contentWindow.document;
        doc.open();
        doc.write(pageHtml);
        doc.close();
        frame.style.display = "block";
        $("loading").style.display = "none";
      })
      .catch(function (e) {
        $("loading").textContent = "Failed to load page. Opening link...";
        setTimeout(function () {
          try { window.open(url, "_blank"); } catch (x) { location.href = url; }
        }, 350);
      });
  }

  function closeViewer() {
    sendWebViewString(MSG_BACK);
    $("viewer").style.display = "none";
    $("main-page").style.display = "block";
    var frame = $("viewer-frame");
    var doc = frame.contentDocument || frame.contentWindow.document;
    doc.open();
    doc.write("");
    doc.close();
  }
  $("btnViewerBack").onclick = closeViewer;

  $("btn-en").onclick = function () {
    wikiLang = "en";
    $("btn-en").classList.add("active");
    $("btn-hi").classList.remove("active");
  };
  $("btn-hi").onclick = function () {
    wikiLang = "hi";
    $("btn-hi").classList.add("active");
    $("btn-en").classList.remove("active");
  };

  // Scroll hint
  var hint = $("scrollHint");
  window.addEventListener("scroll", function () {
    if (window.scrollY > 80) hint.classList.add("hide");
    else hint.classList.remove("hide");
  }, { passive: true });

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  async function loadMixedFeed() {
    var box = $("mixedFeed");
    box.innerHTML = '<div class="loading">Loading practice...</div>';
    try {
      var results = await Promise.allSettled([
        fetch(MCQ_API + "?t=" + Date.now()).then(function (r) { return r.json(); }),
        fetch(POSTS_API).then(function (r) { return r.json(); })
      ]);
      var mcqs = [];
      var posts = [];
      if (results[0].status === "fulfilled") {
        var d = results[0].value;
        if (d && Array.isArray(d.questions)) d = d.questions;
        if (d && Array.isArray(d.data)) d = d.data;
        if (Array.isArray(d)) mcqs = d;
      }
      if (results[1].status === "fulfilled") {
        var p = results[1].value;
        if (p && p.success && Array.isArray(p.posts)) posts = p.posts;
        else if (Array.isArray(p)) posts = p;
      }

      /* Every refresh gets a fresh random MCQ selection/order. */
      mcqs = shuffle(mcqs);
      var maxMcqs = Math.min(mcqs.length, 12);
      mcqs = mcqs.slice(0, maxMcqs);

      var items = [];
      mcqs.forEach(function (q, i) { items.push({ type: "mcq", data: q, index: i }); });
      posts.forEach(function (post) { items.push({ type: "post", data: post }); });

      if (!items.length) {
        box.innerHTML = '<div class="error">No feed items<br><button class="retry" type="button" id="retryFeed">Retry</button></div>';
        $("retryFeed").onclick = loadMixedFeed;
        return;
      }

      items = shuffle(items);
      box.innerHTML = "";
      items.forEach(function (it) {
        if (it.type === "mcq") box.appendChild(renderMcq(it.data, it.index));
        else box.appendChild(renderPost(it.data));
      });
    } catch (e) {
      box.innerHTML = '<div class="error">Failed to load<br><button class="retry" type="button" id="retryFeed">Retry</button></div>';
      $("retryFeed").onclick = loadMixedFeed;
    }
  }

  function renderMcq(item, index) {
    var card = document.createElement("div");
    card.className = "card";
    var uname = item.username || "Educator";
    card.innerHTML =
      '<div class="tag tag-mcq">MCQ · Practice</div>' +
      '<div class="post-header">' +
        '<div class="avatar">' + escapeHTML(uname.charAt(0).toUpperCase()) + "</div>" +
        "<div>" +
          '<div class="uname">' + escapeHTML(uname) + "</div>" +
          '<div class="exam-row">' + examTagsHtml(item) + "</div>" +
          '<div class="meta">' + escapeHTML(item.difficulty || "Medium") + " · answer & learn</div>" +
        "</div>" +
      "</div>" +
      '<div class="q">' + escapeHTML(item.q || "") + "</div>" +
      '<div class="options" id="options-' + index + '"></div>' +
      '<div class="insight-wrap" id="insight-' + index + '"></div>' +
      '<div class="footer-line" id="answered-' + index + '">Tap an option · then see topic notes</div>' +
      '<div class="interact-bar">' +
        '<button class="interact-btn" type="button" data-act="hard">Tough?</button>' +
        '<button class="interact-btn" type="button" data-act="next">More like this</button>' +
      "</div>" +
      '<div class="q-actions">' +
        '<button class="q-action ' + (likedQuestions[getQid(item)] ? "active" : "") + '" type="button" data-qact="like">' +
          (likedQuestions[getQid(item)] ? "♥ Liked" : "♡ Like") + '</button>' +
        '<button class="q-action revision ' + (revisionQuestions[getQid(item)] ? "active" : "") + '" type="button" data-qact="revision">' +
          (revisionQuestions[getQid(item)] ? "✓ In Revision" : "+ Add to Revision") + '</button>' +
      '</div>';

    var optBox = card.querySelector("#options-" + index);
    (item.options || []).forEach(function (opt, i) {
      var d = document.createElement("div");
      d.className = "option";
      d.textContent = opt || "—";
      d.onclick = function () { selectOption(index, i, item); };
      optBox.appendChild(d);
    });

    card.querySelectorAll(".interact-btn").forEach(function (btn) {
      btn.onclick = function () {
        var a = btn.getAttribute("data-act");
        if (a === "hard") btn.textContent = "Marked hard ✓";
        if (a === "next") btn.textContent = "Noted ✓";
        btn.style.background = "#eef2ff";
        btn.style.color = "#3730a3";
      };
    });

    var qid = getQid(item);
    card.setAttribute('data-qid', qid);
    var likeQBtn = card.querySelector('[data-qact="like"]');
    var revBtn = card.querySelector('[data-qact="revision"]');
    if (likeQBtn) likeQBtn.onclick = function () { toggleQuestionLike(qid, likeQBtn); };
    if (revBtn) revBtn.onclick = function () { toggleRevision(qid, revBtn); };

    var followBtn = card.querySelector(".follow-btn");
    if (followBtn) {
      followBtn.onclick = function () { toggleFollow(getTargetUserId(item), followBtn); };
    }
    return card;
  }

  function selectOption(qIndex, selected, item) {
    var options = document.querySelectorAll("#options-" + qIndex + " .option");
    options.forEach(function (opt, i) {
      opt.classList.add("disabled");
      if (i === item.correct) opt.classList.add("correct");
      if (i === selected && selected !== item.correct) opt.classList.add("wrong");
    });
    var ans = $("answered-" + qIndex);
    if (ans) ans.textContent = selected === item.correct ? "Correct ✓ · open notes below" : "Wrong ✗ · revise notes below";
    showTopicInsight(qIndex, item);
  }

  function renderPost(post) {
    var card = document.createElement("div");
    card.className = "card";
    var uname = post.username || "User";
    var imgUrl = post.image || "";
    var imgBlock = imgUrl
      ? '<div class="post-img-wrap"><img src="' + escapeHTML(imgUrl) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.style.display=\'none\'"></div>'
      : "";
    var targetId = getTargetUserId(post);
    if (targetId) card.setAttribute('data-target-user', targetId);
    card.innerHTML =
      '<div class="tag tag-post">Post · Community</div>' +
      '<div class="post-header">' +
        '<div class="avatar">' + escapeHTML(String(uname).charAt(0).toUpperCase()) + "</div>" +
        "<div>" +
          '<div style="display:flex;align-items:center;gap:8px">' +
            '<div class="uname">' + escapeHTML(uname) + "</div>" +
            (getTargetUserId(post) && getTargetUserId(post) !== userId
              ? '<button class="follow-btn ' + (followedUsers[getTargetUserId(post)] ? "following" : "") + '" type="button">' +
                  (followedUsers[getTargetUserId(post)] ? "Following" : "Follow") + '</button>'
              : '') +
          '</div>' +
          '<div class="exam-row">' + examTagsHtml(post) + "</div>" +
          '<div class="meta">' + escapeHTML(post.time || "Recent") + "</div>" +
        "</div>" +
      "</div>" +
      imgBlock +
      '<div class="actions">' +
        '<button class="action like" type="button" aria-label="Like"><svg viewBox="0 0 24 24"><path d="M16.792 3.904A4.989 4.989 0 0 1 21.5 9.122c0 3.072-2.652 4.959-5.197 7.222-2.512 2.243-3.865 3.469-4.303 3.902-.436-.432-1.793-1.66-4.303-3.902C5.152 14.081 2.5 12.194 2.5 9.122a4.989 4.989 0 0 1 4.708-5.218 4.21 4.21 0 0 1 3.675 1.941c.84 1.175.98 1.763 1.12 1.763s.278-.588 1.11-1.766a4.17 4.17 0 0 1 3.679-1.938m0-2a6.04 6.04 0 0 0-4.797 2.127 6.052 6.052 0 0 0-4.787-2.127A6.985 6.985 0 0 0 .5 9.122c0 3.61 2.55 5.827 5.307 8.186a42.86 42.86 0 0 0 4.566 3.606c.192.144.426.22.66.22s.468-.076.66-.221a42.76 42.76 0 0 0 4.565-3.606c2.758-2.358 5.308-4.575 5.308-8.185A6.985 6.985 0 0 0 16.792 1.904z"/></svg></button>' +
        '<button class="action save" type="button" aria-label="Save"><svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg></button>' +
      "</div>" +
      '<div class="likes"><span class="like-count">' + Number(post.likes || 0).toLocaleString() + "</span> likes</div>" +
      '<div class="ptitle">' + escapeHTML(post.title || "") + "</div>" +
      '<div class="pdesc">' + escapeHTML(post.description || "") + "</div>";

    var likeBtn = card.querySelector(".like");
    var saveBtn = card.querySelector(".save");
    likeBtn.onclick = function () {
      var el = card.querySelector(".like-count");
      var n = parseInt(String(el.textContent).replace(/,/g, ""), 10) || 0;
      if (likeBtn.classList.contains("active")) { likeBtn.classList.remove("active"); n--; }
      else { likeBtn.classList.add("active"); n++; }
      el.textContent = n.toLocaleString();
    };
    saveBtn.onclick = function () { saveBtn.classList.toggle("active"); };

    var postFollowBtn = card.querySelector(".follow-btn");
    if (postFollowBtn) {
      postFollowBtn.onclick = function () { toggleFollow(getTargetUserId(post), postFollowBtn); };
    }
    return card;
  }

  function wikiHost() { return wikiLang === "hi" ? "https://hi.wikipedia.org" : "https://en.wikipedia.org"; }

  function buildSearchQuery(item) {
    var chapter = (item.chapter || "").trim();
    var subject = (item.subject || "").trim();
    var q = (item.q || "").replace(/[^\w\s\u0900-\u097F]/g, " ");
    var words = q.split(/\s+/).filter(function (w) { return w.length > 3; }).slice(0, 5).join(" ");
    if (chapter.length > 2) return chapter + (subject ? " " + subject : "");
    if (subject.length > 2) return subject + " " + words;
    return words || "general knowledge";
  }

  async function showTopicInsight(qIndex, item) {
    var box = $("insight-" + qIndex);
    if (!box || box.dataset.loaded === "1") return;
    box.classList.add("show");
    box.innerHTML = '<div style="font-size:.8rem;color:#64748b">Loading notes...</div>';
    try {
      var host = wikiHost();
      var searchUrl = host + "/w/api.php?action=query&list=search&srsearch=" +
        encodeURIComponent(buildSearchQuery(item)) + "&srlimit=4&format=json&origin=*";
      var searchData = await (await fetch(searchUrl)).json();
      var results = (searchData.query && searchData.query.search) || [];
      if (!results.length) {
        box.innerHTML = '<div class="insight-title">📚 Topic</div><div style="font-size:.8rem;color:#64748b">No related topic</div>';
        return;
      }
      var tasks = results.slice(0, 3).map(function (r) {
        return fetch(host + "/api/rest_v1/page/summary/" + encodeURIComponent(r.title))
          .then(function (res) { return res.ok ? res.json() : null; })
          .then(function (sum) {
            if (!sum || sum.type === "disambiguation") return null;
            return {
              t: sum.title || r.title,
              d: sum.extract || "",
              pageUrl: host + "/wiki/" + encodeURIComponent((sum.title || r.title).replace(/ /g, "_"))
            };
          })
          .catch(function () { return null; });
      });
      var cards = (await Promise.all(tasks)).filter(Boolean);
      var html = '<div class="insight-title">📚 Quick notes</div><div class="insight-scroll">';
      cards.forEach(function (c) {
        html += '<div class="insight-card"><h4>' + escapeHTML(c.t) + "</h4><p>" + escapeHTML(c.d) + "</p></div>";
      });
      html += "</div>";
      box.innerHTML = html;
      box.dataset.loaded = "1";
      box.querySelectorAll(".insight-card").forEach(function (el, idx) {
        el.onclick = function () { openSheet(cards[idx].t, cards[idx].pageUrl); };
      });
    } catch (e) {
      box.innerHTML = '<div class="insight-title">📚 Topic</div><div style="font-size:.8rem;color:#64748b">Notes unavailable</div>';
    }
  }

  function openSheet(title, url) {
    $("sheetTitle").textContent = title;
    $("sheetOverlay").classList.add("show");
    var frame = $("sheetFrame");
    var loading = $("sheetLoading");
    loading.style.display = "block";
    frame.style.display = "none";
    frame.onload = function () { loading.style.display = "none"; frame.style.display = "block"; };
    frame.src = url;
  }
  $("btnSheetClose").onclick = function () {
    $("sheetOverlay").classList.remove("show");
    $("sheetFrame").src = "about:blank";
  };
  $("sheetOverlay").onclick = function (e) {
    if (e.target.id === "sheetOverlay") $("btnSheetClose").click();
  };

  /* Pull-to-refresh: pull down from the very top and release. */
  (function () {
    var startY = 0, pulling = false, refreshing = false;
    var pull = $("pullRefresh");

    document.addEventListener("touchstart", function (e) {
      if (refreshing || $("viewer").style.display === "flex" ||
          $("sheetOverlay").classList.contains("show")) return;
      if (window.scrollY <= 2 && e.touches && e.touches.length) {
        startY = e.touches[0].clientY;
        pulling = true;
      }
    }, {passive:true});

    document.addEventListener("touchmove", function (e) {
      if (!pulling || refreshing || !e.touches || !e.touches.length) return;
      var distance = e.touches[0].clientY - startY;
      if (distance > 12 && window.scrollY <= 2) {
        var shown = Math.min(distance, 85);
        pull.style.transform = "translate(-50%," + Math.max(-12, shown - 70) + "px)";
        pull.style.opacity = String(Math.min(1, distance / 65));
        pull.textContent = distance > 65 ? "↑ Release to refresh" : "↓ Pull to refresh";
      }
    }, {passive:true});

    document.addEventListener("touchend", function () {
      if (!pulling) return;
      pulling = false;
      var y = parseFloat((pull.style.transform.match(/,\s*(-?\d+(?:\.\d+)?)px/) || [0,-70])[1]);
      if (y >= -5 && !refreshing) {
        refreshing = true;
        pull.classList.add("show");
        pull.style.transform = "translate(-50%,8px)";
        pull.style.opacity = "1";
        pull.textContent = "⟳ Refreshing...";
        loadMixedFeed().finally(function () {
          setTimeout(function () {
            pull.classList.remove("show");
            pull.style.transform = "translate(-50%,-70px)";
            pull.style.opacity = "0";
            refreshing = false;
          }, 300);
        });
      } else {
        pull.style.transform = "translate(-50%,-70px)";
        pull.style.opacity = "0";
      }
    }, {passive:true});
  })();

  /* IMPORTANT: Load/render the MCQ + posts FIRST.
     Only after the feed is visible do we read the Kodular/App Inventor string
     and then load the user's Firebase state. */
  loadMixedFeed().then(function () {
    return loadCurrentUser();
  });
})();
</script>
